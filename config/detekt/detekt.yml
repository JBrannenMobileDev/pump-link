# Only the rules this project relies on as controls. Everything else comes from
# detekt's defaults via buildUponDefaultConfig.
#
# The rule that matters here is ElseCaseInsteadOfExhaustiveWhen. ADR-02 claims
# that adding a state or an intent breaks the build until every screen handles
# it. That claim is only true while nobody writes `else`, so the claim needs a
# mechanism rather than a convention.
#
# The rule needs type resolution to tell whether a `when` subject is sealed.
# detekt 1.23.8 only creates type-resolution tasks (detektMain) for plain JVM
# modules; it does not create them for AGP 9 Android modules. The MVI reducer
# and the connection-state projection therefore live in :presentation, which
# is a JVM module, so ElseCaseInsteadOfExhaustiveWhen actually runs on them.
# :app and :data still only get the syntactic pass. That is acceptable: they
# are not allowed to contain a reducer.

build:
  maxIssues: 0

potential-bugs:
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  ExitOutsideMain:
    active: true
  UnsafeCallOnNullableType:
    active: false
  UnreachableCode:
    # Detekt disagrees with Kotlin about `?: return` smart-casts.
    active: false

coroutines:
  InjectDispatcher:
    active: false

style:
  UnusedPrivateMember:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
  ReturnCount:
    active: false
  MagicNumber:
    active: false

naming:
  FunctionNaming:
    active: false

complexity:
  LongMethod:
    active: true
    threshold: 80
  CyclomaticComplexMethod:
    # Protocol reducers are legitimately branchy; the state machine is the
    # complexity, not an accident of style.
    active: false
  TooManyFunctions:
    # LinkReducer is one function per leaf state; PumpCore is the record store.
    # Splitting them would add dispatch, not meaning.
    active: false
  LongParameterList:
    active: false
  ComplexCondition:
    active: false
  NestedBlockDepth:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
