<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:655px;height:472px;background:#FFFFFF;" width="655px" height="472px" viewBox="0 0 655 472" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="198.879" y="29.07" fill="#1F2933" font-size="15" textLength="255.842" font-weight="700" font-family="'Liberation Sans'">Fragmentation at the minimum MTU</text></g><g><title>Transport L1</title><rect x="128.562" y="78.197" width="8" height="353.184" fill="#000" fill-opacity="0"/><line x1="132.062" y1="78.197" x2="132.062" y2="431.381" style="stroke:#B4BECD;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>GATT Server L1</title><rect x="394.646" y="78.197" width="8" height="353.184" fill="#000" fill-opacity="0"/><line x1="398.146" y1="78.197" x2="398.146" y2="431.381" style="stroke:#B4BECD;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="88.21" y="48.249" width="87.703" height="28.949" fill="#DBEAFE" style="stroke:#8FA3BF;stroke-width:0.5;" rx="3" ry="3"/><text x="95.21" y="67.442" fill="#1F2933" font-size="13" textLength="73.703" font-family="'Liberation Sans'">Transport L1</text><rect x="343.827" y="48.249" width="108.637" height="28.949" fill="#FEE2E2" style="stroke:#8FA3BF;stroke-width:0.5;" rx="3" ry="3"/><text x="350.827" y="67.442" fill="#1F2933" font-size="13" textLength="94.637" font-family="'Liberation Sans'">GATT Server L1</text><rect x="88.21" y="431.381" width="87.703" height="28.949" fill="#DBEAFE" style="stroke:#8FA3BF;stroke-width:0.5;" rx="3" ry="3"/><text x="95.21" y="450.575" fill="#1F2933" font-size="13" textLength="73.703" font-family="'Liberation Sans'">Transport L1</text><rect x="343.827" y="431.381" width="108.637" height="28.949" fill="#FEE2E2" style="stroke:#8FA3BF;stroke-width:0.5;" rx="3" ry="3"/><text x="350.827" y="450.575" fill="#1F2933" font-size="13" textLength="94.637" font-family="'Liberation Sans'">GATT Server L1</text><path d="M87.977,94.197 L87.977,125.197 A3,3 0 0 0 90.977,128.197 L438.977,128.197 A3,3 0 0 0 441.977,125.197 L441.977,101.197 L431.977,91.197 L90.977,91.197 A3,3 0 0 0 87.977,94.197" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M431.977,91.197 L431.977,99.697 A1.5,1.5 0 0 0 433.477,101.197 L441.977,101.197 L431.977,91.197" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="177.069" y="107.453" fill="#4A4230" font-size="12" textLength="167.068" font-family="'Liberation Sans'">ATT_MTU = 23, so 19 octets of</text><text x="177.069" y="121.252" fill="#4A4230" font-size="12" textLength="142.072" font-family="'Liberation Sans'">fragment payload per write</text><path d="M15,141.795 L15,172.795 A3,3 0 0 0 18,175.795 L246,175.795 A3,3 0 0 0 249,172.795 L249,148.795 L239,138.795 L18,138.795 A3,3 0 0 0 15,141.795" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M239,138.795 L239,147.295 A1.5,1.5 0 0 0 240.5,148.795 L249,148.795 L239,138.795" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="21" y="155.051" fill="#4A4230" font-size="12" textLength="169.395" font-family="'Liberation Sans'">BOLUS_REQ PDU is 22 octets:</text><text x="21" y="168.85" fill="#4A4230" font-size="12" textLength="213.123" font-family="'Liberation Sans'">8 header + 4 payload + 8 MAC + 2 CRC</text><polygon points="386.146,197.191,396.146,201.191,386.146,205.191,390.146,201.191" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="132.062" y1="201.191" x2="392.146" y2="201.191" style="stroke:#44546A;stroke-width:1;"/><text x="139.062" y="196.648" fill="#2F3B4C" font-size="12" font-weight="700" font-family="'Liberation Sans'">1</text><text x="149.735" y="196.648" fill="#2F3B4C" font-size="12" textLength="231.41" font-family="'Liberation Sans'">write CMD, hdr 0x80 FIRST idx 0, 19 octets</text><path d="M403.146,217.191 L403.146,234.191 A3,3 0 0 0 406.146,237.191 L610.146,237.191 A3,3 0 0 0 613.146,234.191 L613.146,224.191 L603.146,214.191 L406.146,214.191 A3,3 0 0 0 403.146,217.191" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M603.146,214.191 L603.146,222.691 A1.5,1.5 0 0 0 604.646,224.191 L613.146,224.191 L603.146,214.191" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="409.146" y="230.447" fill="#4A4230" font-size="12" textLength="189.398" font-family="'Liberation Sans'">FIRST resets the reassembly buffer</text><polygon points="386.146,258.789,396.146,262.789,386.146,266.789,390.146,262.789" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="132.062" y1="262.789" x2="392.146" y2="262.789" style="stroke:#44546A;stroke-width:1;"/><text x="139.062" y="258.246" fill="#2F3B4C" font-size="12" font-weight="700" font-family="'Liberation Sans'">2</text><text x="149.735" y="258.246" fill="#2F3B4C" font-size="12" textLength="220.084" font-family="'Liberation Sans'">write CMD, hdr 0x41 LAST idx 1, 3 octets</text><path d="M403.146,278.789 L403.146,295.789 A3,3 0 0 0 406.146,298.789 L636.146,298.789 A3,3 0 0 0 639.146,295.789 L639.146,285.789 L629.146,275.789 L406.146,275.789 A3,3 0 0 0 403.146,278.789" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M629.146,275.789 L629.146,284.289 A1.5,1.5 0 0 0 630.646,285.789 L639.146,285.789 L629.146,275.789" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="409.146" y="292.045" fill="#4A4230" font-size="12" textLength="215.455" font-family="'Liberation Sans'">LAST completes, 22 octets passed to L2</text><line x1="133.062" y1="324.387" x2="143.062" y2="320.387" style="stroke:#44546A;stroke-width:1;"/><line x1="133.062" y1="324.387" x2="143.062" y2="328.387" style="stroke:#44546A;stroke-width:1;"/><line x1="132.062" y1="324.387" x2="397.146" y2="324.387" style="stroke:#44546A;stroke-width:1;"/><text x="149.062" y="319.844" fill="#2F3B4C" font-size="12" font-weight="700" font-family="'Liberation Sans'">3</text><text x="159.735" y="319.844" fill="#2F3B4C" font-size="12" textLength="216.768" font-family="'Liberation Sans'">BOLUS_RSP, fragmented the same way</text><path d="M87.977,340.387 L87.977,412.387 A3,3 0 0 0 90.977,415.387 L438.977,415.387 A3,3 0 0 0 441.977,412.387 L441.977,347.387 L431.977,337.387 L90.977,337.387 A3,3 0 0 0 87.977,340.387" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFE8E8"/><path d="M431.977,337.387 L431.977,345.887 A1.5,1.5 0 0 0 433.477,347.387 L441.977,347.387 L431.977,337.387" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFE8E8"/><text x="109.859" y="353.643" fill="#4A4230" font-size="12" textLength="283.482" font-family="'Liberation Sans'">The reassembly buffer is discarded on disconnection,</text><text x="109.859" y="367.441" fill="#4A4230" font-size="12" textLength="248.109" font-family="'Liberation Sans'">on a FIRST arriving mid-message, on an index</text><text x="109.859" y="381.24" fill="#4A4230" font-size="12" textLength="259.5" font-family="'Liberation Sans'">discontinuity, and above 512 octets. A buffer that</text><text x="109.859" y="395.039" fill="#4A4230" font-size="12" textLength="301.488" font-family="'Liberation Sans'">survives a disconnection is how two unrelated messages</text><text x="109.859" y="408.838" fill="#4A4230" font-size="12" textLength="280.143" font-family="'Liberation Sans'">get spliced into one valid-looking PDU. Hazard H-09.</text></g></svg>