887.435" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="139.26" y="904.195" fill="#E3D9B8" font-size="12" textLength="223.392" font-family="'Helvetica Neue'">Subscribed means the transport is usable</text><text x="139.26" y="918.511" fill="#E3D9B8" font-size="12" textLength="215.82" font-family="'Helvetica Neue'">and notifications are confirmed enabled.</text><text x="139.26" y="932.827" fill="#E3D9B8" font-size="12" textLength="183.804" font-family="'Helvetica Neue'">No L3 traffic is permitted before it,</text><text x="139.26" y="947.143" fill="#E3D9B8" font-size="12" textLength="181.344" font-family="'Helvetica Neue'">which is what makes hazard H-11</text><text x="139.26" y="961.459" fill="#E3D9B8" font-size="12" textLength="216.048" font-family="'Helvetica Neue'">unreachable rather than merely avoided.</text></g><!--link Linking to Authenticating--><g class="link" data-entity-1="ent0001" data-entity-2="ent0018" id="lnk19" data-source-line="16" data-link-type="dependency"><path d="M75.88,811.875 C68.14,849.955 62.604,877.225 58.424,897.835" style="stroke:#8B98A8;stroke-width:1;" fill="none" id="Linking-to-Authenticating"/><polygon points="57.43,902.735,63.139,894.71,58.424,897.835,55.299,893.12,57.43,902.735" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="70.39" y="854.195" fill="#C9D1D9" font-size="12" textLength="73.788" font-family="'Helvetica Neue'">begin session</text></g></g></svg>