,333.66,222.341" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="331.66" y1="222.341" x2="517.095" y2="222.341" style="stroke:#8B98A8;stroke-width:1;stroke-dasharray:2,2;"/><text x="343.66" y="217.798" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Liberation Sans'">4</text><text x="354.334" y="217.798" fill="#C9D1D9" font-size="12" textLength="34.014" font-family="'Liberation Sans'">record</text><line x1="80.246" y1="245.14" x2="90.246" y2="255.14" style="stroke:#8B98A8;stroke-width:2;"/><line x1="80.246" y1="255.14" x2="90.246" y2="245.14" style="stroke:#8B98A8;stroke-width:2;"/><line x1="85.246" y1="250.14" x2="315.66" y2="250.14" style="stroke:#8B98A8;stroke-width:1;"/><text x="90.246" y="245.597" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Liberation Sans'">5</text><text x="100.92" y="245.597" fill="#C9D1D9" font-size="12" textLength="94.037" font-family="'Liberation Sans'">BOLUS_RSP lost</text><path d="M18.396,266.14 L18.396,283.14 A3,3 0 0 0 21.396,286.14 L124.396,286.14 A3,3 0 0 0 127.396,283.14 L127.396,273.14 L117.396,263.14 L21.396,263.14 A3,3 0 0 0 18.396,266.14" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M117.396,263.14 L117.396,271.64 A1.5,1.5 0 0 0 118.896,273.14 L127.396,273.14 L117.396,263.14" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="24.396" y="279.396" fill="#E3D9B8" font-size="12" textLength="88.699" font-family="'Liberation Sans'">T_RESP expires</text><polygon points="304.66,321.537,314.66,325.537,304.66,329.537,308.66,325.537" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="73.246" y1="325.537" x2="310.66" y2="325.537" style="stroke:#8B98A8;stroke-width:1;"/><text x="80.246" y="314.094" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Liberation Sans'">6</text><text x="90.92" y="307.195" fill="#C9D1D9" font-size="12" textLength="156.053" font-family="'Liberation Sans'">retransmit byte-identical PDU</text><text x="90.92" y="320.994" fill="#C9D1D9" font-size="12" textLength="196.752" font-family="'Liberation Sans'">cmd = 0x1A7F, seq = 12, same MAC</text><path d="M331.66,341.537 L331.66,386.537 A3,3 0 0 0 334.66,389.537 L557.66,389.537 A3,3 0 0 0 560.66,386.537 L560.66,348.537 L550.66,338.537 L334.66,338.537 A3,3 0 0 0 331.66,341.537" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M550.66,338.537 L550.66,347.037 A1.5,1.5 0 0 0 552.16,348.537 L560.66,348.537 L550.66,338.537" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="337.66" y="354.792" fill="#E3D9B8" font-size="12" textLength="208.137" font-family="'Liberation Sans'">seq equals lastAccepted and content is</text><text x="337.66" y="368.591" fill="#E3D9B8" font-size="12" textLength="63.369" font-family="'Liberation Sans'">identical, so</text><text x="404.363" y="368.591" fill="#E3D9B8" font-size="12" textLength="14.004" font-weight="700" font-family="'Liberation Sans'">L2</text><text x="421.701" y="368.591" fill="#E3D9B8" font-size="12" textLength="100.729" font-family="'Liberation Sans'">replays the cached</text><text x="337.66" y="382.39" fill="#E3D9B8" font-size="12" textLength="196.799" font-family="'Liberation Sans'">response and never dispatches to L3</text><polygon points="84.246,410.732,74.246,414.732,84.246,418.732,80.246,414.732" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="78.246" y1="414.732" x2="315.66" y2="414.732" style="stroke:#8B98A8;stroke-width:1;stroke-dasharray:2,2;"/><text x="90.246" y="410.189" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Liberation Sans'">7</text><text x="100.92" y="410.189" fill="#C9D1D9" font-size="12" textLength="134.719" font-family="'Liberation Sans'">BOLUS_RSP from cache</text><rect x="10" y="443.206" width="753.508" height="3" fill="#1C2530" style="stroke:#1C2530;stroke-width:1;" rx="3" ry="3"/><line x1="10" y1="443.206" x2="763.508" y2="443.206" style="stroke:#39414C;stroke-width:1;"/><line x1="10" y1="446.206" x2="763.508" y2="446.206" style="stroke:#39414C;stroke-width:1;"/><rect x="229.118" y="432.732" width="315.272" height="22.949" fill="#1C2530" style="stroke:#39414C;stroke-width:2;" rx="3" ry="3"/><text x="235.118" y="448.926" fill="#C9D1D9" font-size="13" textLength="297.661" font-weight="700" font-family="'Liberation Sans'">later: reconnect, new session, seq counter reset</text><polygon points="304.66,481.479,314.66,485.479,304.66,489.479,308.66,485.479" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="73.246" y1="485.479" x2="310.66" y2="485.479" style="stroke:#8B98A8;stroke-width:1;"/><text x="80.246" y="480.937" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Liberation Sans'">8</text><text x="90.92" y="480.937" fill="#C9D1D9" font-size="12" textLength="200.76" font-family="'Liberation Sans'">BOLUS_REQ cmd = 0x1A7F, seq = 0</text><path d="M331.66,501.479 L331.66,532.479 A3,3 0 0 0 334.66,535.479 L553.66,535.479 A3,3 0 0 0 556.66,532.479 L556.66,508.479 L546.66,498.479 L334.66,498.479 A3,3 0 0 0 331.66,501.479" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M546.66,498.479 L546.66,506.979 A1.5,1.5 0 0 0 548.16,508.479 L556.66,508.479 L546.66,498.479" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="337.66" y="514.735" fill="#E3D9B8" font-size="12" textLength="204.123" font-family="'Liberation Sans'">new session, so the sequence window</text><text x="337.66" y="528.534" fill="#E3D9B8" font-size="12" textLength="130.078" font-family="'Liberation Sans'">offers no protection here</text><polygon points="506.095,556.876,516.095,560.876,506.095,564.876,510.095,560.876" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="326.66" y1="560.876" x2="512.095" y2="560.876" style="stroke:#8B98A8;stroke-width:1;"/><text x="333.66" y="556.333" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Liberation Sans'">9</text><text x="344.334" y="556.333" fill="#C9D1D9" font-size="12" textLength="44.695" font-family="'Liberation Sans'">dispatch</text><line x1="528.095" y1="588.675" x2="570.095" y2="588.675" style="stroke:#8B98A8;stroke-width:1;"/><line x1="570.095" y1="588.675" x2="570.095" y2="601.675" style="stroke:#8B98A8;stroke-width:1;"/><line x1="529.095" y1="601.675" x2="570.095" y2="601.675" style="stroke:#8B98A8;stroke-width:1;"/><polygon points="539.095,597.675,529.095,601.675,539.095,605.675,535.095,601.675" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="535.095" y="584.132" fill="#C9D1D9" font-size="12" textLength="13.348" font-weight="700" font-family="'Liberation Sans'">10</text><text x="552.443" y="584.132" fill="#C9D1D9" font-size="12" textLength="172.74" font-family="'Liberation Sans'">record for 0x1A7F already exists</text><polygon points="337.66,625.474,327.66,629.474,337.66,633.474,333.66,629.474" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="331.66" y1="629.474" x2="517.095" y2="629.474" style="stroke:#8B98A8;stroke-width:1;stroke-dasharray:2,2;"/><text x="343.66" y="624.931" fill="#C9D1D9" font-size="12" textLength="13.348" font-weight="700" font-family="'Liberation Sans'">11</text><text x="361.008" y="624.931" fill="#C9D1D9" font-size="12" textLength="81.369" font-family="'Liberation Sans'">existing record,</text><text x="445.711" y="624.931" fill="#C9D1D9" font-size="12" textLength="65.385" font-style="italic" font-family="'Liberation Sans'">no actuation</text><polygon points="84.246,653.272,74.246,657.272,84.246,661.272,80.246,657.272" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="78.246" y1="657.272" x2="315.66" y2="657.272" style="stroke:#8B98A8;stroke-width:1;stroke-dasharray:2,2;"/><text x="90.246" y="652.729" fill="#C9D1D9" font-size="12" textLength="13.348" font-weight="700" font-family="'Liberation Sans'">12</text><text x="107.594" y="652.729" fill="#C9D1D9" font-size="12" textLength="202.066" font-family="'Liberation Sans'">BOLUS_RSP COMPLETED 4500 mU</text><path d="M31.686,673.272 L31.686,745.272 A3,3 0 0 0 34.686,748.272 L560.686,748.272 A3,3 0 0 0 563.686,745.272 L563.686,680.272 L553.686,670.272 L34.686,670.272 A3,3 0 0 0 31.686,673.272" style="stroke:#6B5E32;stroke-width:0.5;" fill="#1F3A22"/><path d="M553.686,670.272 L553.686,678.772 A1.5,1.5 0 0 0 555.186,680.272 L563.686,680.272 L553.686,670.272" style="stroke:#6B5E32;stroke-width:0.5;" fill="#1F3A22"/><text x="125.222" y="686.528" fill="#E3D9B8" font-size="12" textLength="234.129" font-family="'Liberation Sans'">Two independent suppression mechanisms.</text><text x="125.222" y="700.327" fill="#E3D9B8" font-size="12" textLength="309.48" font-family="'Liberation Sans'">Sequence numbers cover retransmission within a session.</text><text x="125.222" y="714.126" fill="#E3D9B8" font-size="12" textLength="275.438" font-family="'Liberation Sans'">The delivery record covers reissue across sessions,</text><text x="125.222" y="727.925" fill="#E3D9B8" font-size="12" textLength="336.896" font-family="'Liberation Sans'">where the sequence counter has been reset and offers nothing.</text><text x="125.222" y="741.724" fill="#E3D9B8" font-size="12" textLength="323.514" font-family="'Liberation Sans'">A design with only the first double-doses on every reconnect.</text></g></svg>