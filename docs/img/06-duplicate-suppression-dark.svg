.839" y1="674.606" x2="313.983" y2="674.606" style="stroke:#8B98A8;stroke-width:1;stroke-dasharray:2,2;"/><text x="90.839" y="670.002" fill="#C9D1D9" font-size="12" textLength="13.344" font-weight="700" font-family="'Helvetica Neue'">12</text><text x="108.183" y="669.882" fill="#C9D1D9" font-size="12" textLength="198.504" font-family="'Helvetica Neue'">BOLUS_RSP COMPLETED 4500 mU</text><path d="M31.864,690.606 L31.864,765.606 A3,3 0 0 0 34.864,768.606 L561.864,768.606 A3,3 0 0 0 564.864,765.606 L564.864,697.606 L554.864,687.606 L34.864,687.606 A3,3 0 0 0 31.864,690.606" style="stroke:#6B5E32;stroke-width:0.5;" fill="#1F3A22"/><path d="M554.864,687.606 L554.864,696.106 A1.5,1.5 0 0 0 556.364,697.606 L564.864,697.606 L554.864,687.606" style="stroke:#6B5E32;stroke-width:0.5;" fill="#1F3A22"/><text x="124.621" y="704.366" fill="#E3D9B8" font-size="12" textLength="236.736" font-family="'Helvetica Neue'">Two independent suppression mechanisms.</text><text x="124.621" y="718.682" fill="#E3D9B8" font-size="12" textLength="311.388" font-family="'Helvetica Neue'">Sequence numbers cover retransmission within a session.</text><text x="124.621" y="732.998" fill="#E3D9B8" font-size="12" textLength="276" font-family="'Helvetica Neue'">The delivery record covers reissue across sessions,</text><text x="124.621" y="747.314" fill="#E3D9B8" font-size="12" textLength="339.396" font-family="'Helvetica Neue'">where the sequence counter has been reset and offers nothing.</text><text x="124.621" y="761.63" fill="#E3D9B8" font-size="12" textLength="328.488" font-family="'Helvetica Neue'">A design with only the first double-doses on every reconnect.</text></g></svg>