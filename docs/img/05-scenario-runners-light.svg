<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:942px;height:353px;background:#FFFFFF;" width="942px" height="353px" viewBox="0 0 942 353" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="347.863" y="25.06" fill="#1F2933" font-size="15" textLength="239.46" font-weight="700" font-family="'Helvetica Neue'">One scenario table, three runners</text></g><!--entity ST--><g class="entity" data-qualified-name="ST" id="ent0001" data-source-line="5"><rect x="356.64" y="46.315" width="196.735" height="66.891" fill="#E7E3F7" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="366.64" y="69.367" fill="#4A5568" font-size="13" textLength="89.297" font-weight="700" font-family="'Helvetica Neue'">Scenario table</text><text x="366.64" y="84.928" fill="#4A5568" font-size="13" textLength="164.697" font-family="'Helvetica Neue'">preconditions, injected fault,</text><text x="366.64" y="100.437" fill="#4A5568" font-size="13" textLength="176.735" font-family="'Helvetica Neue'">expected observable outcome</text></g><!--entity JVM--><g class="entity" data-qualified-name="JVM" id="ent0002" data-source-line="7"><rect x="7" y="173.205" width="212.01" height="66.891" fill="#DBEAFE" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="196.257" fill="#4A5568" font-size="13" textLength="71.526" font-weight="700" font-family="'Helvetica Neue'">JVM runner</text><text x="17" y="211.818" fill="#4A5568" font-size="13" textLength="192.01" font-family="'Helvetica Neue'">LoopbackTransport + PumpCore</text><text x="17" y="227.327" fill="#4A5568" font-size="13" textLength="150.007" font-family="'Helvetica Neue'">17 of 20 rows, every push</text></g><!--entity AND--><g class="entity" data-qualified-name="AND" id="ent0003" data-source-line="8"><rect x="254.45" y="173.205" width="199.101" height="66.891" fill="#DBEAFE" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="264.45" y="196.257" fill="#4A5568" font-size="13" textLength="179.101" font-weight="700" font-family="'Helvetica Neue'">Android instrumented runner</text><text x="264.45" y="211.818" fill="#4A5568" font-size="13" textLength="120.848" font-family="'Helvetica Neue'">two physical devices</text><text x="264.45" y="227.327" fill="#4A5568" font-size="13" textLength="79.209" font-family="'Helvetica Neue'">20 of 20 rows</text></g><!--entity IOS--><g class="entity" data-qualified-name="IOS" id="ent0004" data-source-line="9"><rect x="488.45" y="180.955" width="135.102" height="51.382" fill="#FEE2E2" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="498.45" y="204.007" fill="#4A5568" font-size="13" textLength="115.102" font-weight="700" font-family="'Helvetica Neue'">iOS XCTest runner</text><text x="498.45" y="219.568" fill="#4A5568" font-size="13" textLength="106.912" font-family="'Helvetica Neue'">specified, not built</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="16"><path d="M658.83,190.335 L658.83,222.967 A3,3 0 0 0 661.83,225.967 L924.186,225.967 A3,3 0 0 0 927.186,222.967 L927.186,197.335 L917.186,187.335 L746.52,187.335 L543.81,113.575 L738.52,187.335 L661.83,187.335 A3,3 0 0 0 658.83,190.335" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M917.186,187.335 L917.186,195.835 A1.5,1.5 0 0 0 918.686,197.335 L927.186,197.335 L917.186,187.335" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="664.83" y="204.095" fill="#4A4230" font-size="12" textLength="247.356" font-family="'Helvetica Neue'">No row asserts anything about a platform API.</text><text x="664.83" y="218.411" fill="#4A4230" font-size="12" textLength="219.132" font-family="'Helvetica Neue'">That is what lets one table drive all three.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="21"><path d="M450.93,303.095 L450.93,335.727 A3,3 0 0 0 453.93,338.727 L658.086,338.727 A3,3 0 0 0 661.086,335.727 L661.086,310.095 L651.086,300.095 L560,300.095 L556,232.785 L552,300.095 L453.93,300.095 A3,3 0 0 0 450.93,303.095" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M651.086,300.095 L651.086,308.595 A1.5,1.5 0 0 0 652.586,310.095 L661.086,310.095 L651.086,300.095" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="456.93" y="316.855" fill="#4A4230" font-size="12" textLength="158.928" font-family="'Helvetica Neue'">Marked "spec", never "pass".</text><text x="456.93" y="331.171" fill="#4A4230" font-size="12" textLength="189.156" font-family="'Helvetica Neue'">No iOS implementation exists here.</text></g><!--link ST to JVM--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="11" data-link-type="dependency"><path d="M365.15,113.575 C315.18,131.815 257.867,152.75 207.847,171.01" style="stroke:#44546A;stroke-width:1;" fill="none" id="ST-to-JVM"/><polygon points="203.15,172.725,212.976,173.396,207.847,171.01,210.233,165.881,203.15,172.725" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link ST to AND--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-source-line="12" data-link-type="dependency"><path d="M428.47,113.575 C413.62,131.925 398.325,150.848 383.505,169.168" style="stroke:#44546A;stroke-width:1;" fill="none" id="ST-to-AND"/><polygon points="380.36,173.055,389.13,168.574,383.505,169.168,382.911,163.542,380.36,173.055" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link ST to IOS--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk7" data-source-line="13" data-link-type="dependency"><path d="M481.54,113.575 C498.49,134.525 516.985,157.398 532.565,176.658" style="stroke:#44546A