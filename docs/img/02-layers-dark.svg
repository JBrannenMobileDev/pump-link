<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:629px;height:460px;background:#0D1117;" width="629px" height="460px" viewBox="0 0 629 460" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="629" height="460" fill="#0D1117" style="stroke:none;"/><g class="title" data-source-line="3"><text x="249.987" y="24.07" fill="#E6EDF3" font-size="15" textLength="122.527" font-weight="700" font-family="'Liberation Sans'">Protocol layering</text></g><!--entity L4--><g class="entity" data-qualified-name="L4" id="ent0001" data-source-line="5"><rect x="23" y="50.249" width="320.612" height="49.897" fill="#17314F" style="stroke:#39414C;stroke-width:0.5;" rx="3" ry="3"/><text x="33" y="72.442" fill="#AEB9C6" font-size="13" textLength="85.249" font-weight="700" font-family="'Liberation Sans'">L4 — Session</text><text x="33" y="87.391" fill="#AEB9C6" font-size="13" textLength="300.612" font-family="'Liberation Sans'">mutual authentication, key derivation, replay window</text></g><!--entity L3--><g class="entity" data-qualified-name="L3" id="ent0002" data-source-line="6"><rect x="14" y="136.249" width="338.652" height="49.897" fill="#17314F" style="stroke:#39414C;stroke-width:0.5;" rx="3" ry="3"/><text x="24" y="158.442" fill="#AEB9C6" font-size="13" textLength="104.019" font-weight="700" font-family="'Liberation Sans'">L3 — Operations</text><text x="24" y="173.391" fill="#AEB9C6" font-size="13" textLength="318.652" font-family="'Liberation Sans'">opcodes, request/response correlation, ACK/NAK, retry</text></g><!--entity L2--><g class="entity" data-qualified-name="L2" id="ent0003" data-source-line="7"><rect x="6" y="222.249" width="354.598" height="49.897" fill="#17314F" style="stroke:#39414C;stroke-width:0.5;" rx="3" ry="3"/><text x="16" y="244.442" fill="#AEB9C6" font-size="13" textLength="121.374" font-weight="700" font-family="'Liberation Sans'">L2 — Message PDU</text><text x="16" y="259.391" fill="#AEB9C6" font-size="13" textLength="334.598" font-family="'Liberation Sans'">header, sequence, CRC-16, message authentication code</text></g><!--entity L1--><g class="entity" data-qualified-name="L1" id="ent0004" data-source-line="8"><rect x="16.5" y="308.249" width="334.33" height="49.897" fill="#2E2848" style="stroke:#39414C;stroke-width:0.5;" rx="3" ry="3"/><text x="26.5" y="330.442" fill="#AEB9C6" font-size="13" textLength="125.677" font-weight="700" font-family="'Liberation Sans'">L1 — Fragmentation</text><text x="26.5" y="345.391" fill="#AEB9C6" font-size="13" textLength="314.33" font-family="'Liberation Sans'">split and reassemble against the negotiated ATT_MTU</text></g><!--entity L0--><g class="entity" data-qualified-name="L0" id="ent0005" data-source-line="9"><rect x="32.5" y="394.249" width="301.779" height="49.897" fill="#4A1F1F" style="stroke:#39414C;stroke-width:0.5;" rx="3" ry="3"/><text x="42.5" y="416.442" fill="#AEB9C6" font-size="13" textLength="70.776" font-weight="700" font-family="'Liberation Sans'">L0 — GATT</text><text x="42.5" y="431.391" fill="#AEB9C6" font-size="13" textLength="281.779" font-family="'Liberation Sans'">write-with-response on CMD, notification on RSP</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="17"><path d="M368.5,324.249 L368.5,329.249 L350.703,333.249 L368.5,337.249 L368.5,342.047 A3,3 0 0 0 371.5,345.047 L517.879,345.047 A3,3 0 0 0 520.879,342.047 L520.879,331.249 L510.879,321.249 L371.5,321.249 A3,3 0 0 0 368.5,324.249" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M510.879,321.249 L510.879,329.749 A1.5,1.5 0 0 0 512.379,331.249 L520.879,331.249 L510.879,321.249" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="374.5" y="337.504" fill="#E3D9B8" font-size="12" textLength="131.379" font-family="'Liberation Sans'">Only L1 knows the MTU.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="21"><path d="M362,66.249 L362,71.249 L344.234,75.249 L362,79.249 L362,84.047 A3,3 0 0 0 365,87.047 L510.061,87.047 A3,3 0 0 0 513.061,84.047 L513.061,73.249 L503.061,63.249 L365,63.249 A3,3 0 0 0 362,66.249" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M503.061,63.249 L503.061,71.749 A1.5,1.5 0 0 0 504.561,73.249 L513.061,73.249 L503.061,63.249" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="368" y="79.504" fill="#E3D9B8" font-size="12" textLength="130.061" font-family="'Liberation Sans'">Only L4 knows the keys.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="25"><path d="M379.5,231.249 L379.5,243.249 L361.091,247.249 L379.5,251.249 L379.5,262.846 A3,3 0 0 0 382.5,265.846 L610.963,265.846 A3,3 0 0 0 613.963,262.846 L613.963,238.249 L603.963,228.249 L382.5,228.249 A3,3 0 0 0 379.5,231.249" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M603.963,228.249 L603.963,236.749 A1.5,1.5 0 0 0 605.463,238.249 L613.963,238.249 L603.963,228.249" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="385.5" y="244.504" fill="#E3D9B8" font-size="12" textLength="213.463" font-family="'Liberation Sans'">L2 and L3 are pure byte transformations</text><text x="385.5" y="258.303" fill="#E3D9B8" font-size="12" textLength="201.445" font-family="'Liberation Sans'">and are the bulk of the JVM test suite.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="183.5,136.007,187.5,127.007,183.5,131.007,179.5,127.007,183.5,136.007" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M183.5,100.545 C183.5,111.689 183.5,119.869 183.5,131.007" style="stroke:#8B98A8;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="183.5,222.007,187.5,213.007,183.5,217.007,179.5,213.007,183.5,222.007" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M183.5,186.545 C183.5,197.689 183.5,205.869 183.5,217.007" style="stroke:#8B98A8;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="183.5,308.007,187.5,299.007,183.5,303.007,179.5,299.007,183.5,308.007" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M183.5,272.545 C183.5,283.689 183.5,291.869 183.5,303.007" style="stroke:#8B98A8;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="183.5,394.007,187.5,385.007,183.5,389.007,179.5,385.007,183.5,394.007" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M183.5,358.545 C183.5,369.689 183.5,377.869 183.5,389.007" style="stroke:#8B98A8;stroke-width:1;" fill="none"/></g></g></svg>