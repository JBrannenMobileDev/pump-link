1.749 A3,3 0 0 0 315,424.749" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M526.115,421.749 L526.115,430.249 A1.5,1.5 0 0 0 527.615,431.749 L536.115,431.749 L526.115,421.749" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="321" y="438.004" fill="#4A4230" font-size="12" textLength="158.08" font-family="'Liberation Sans'">Every substate has a timeout.</text><text x="321" y="451.803" fill="#4A4230" font-size="12" textLength="197.426" font-family="'Liberation Sans'">Expiry leaves Linking for Recovering,</text><text x="321" y="465.602" fill="#4A4230" font-size="12" textLength="200.115" font-family="'Liberation Sans'">which is elided here; see the top-level</text><text x="321" y="479.401" fill="#4A4230" font-size="12" textLength="46.688" font-family="'Liberation Sans'">diagram.</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="26"><path d="M122.5,914.249 L122.5,987.243 A3,3 0 0 0 125.5,990.243 L361.287,990.243 A3,3 0 0 0 364.287,987.243 L364.287,921.249 L354.287,911.249 L240.31,911.249 L226.519,858.473 L232.31,911.249 L125.5,911.249 A3,3 0 0 0 122.5,914.249" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M354.287,911.249 L354.287,919.749 A1.5,1.5 0 0 0 355.787,921.249 L364.287,921.249 L354.287,911.249" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="128.5" y="927.504" fill="#4A4230" font-size="12" textLength="220.787" font-family="'Liberation Sans'">Subscribed means the transport is usable</text><text x="128.5" y="941.303" fill="#4A4230" font-size="12" textLength="212.801" font-family="'Liberation Sans'">and notifications are confirmed enabled.</text><text x="128.5" y="955.102" fill="#4A4230" font-size="12" textLength="175.406" font-family="'Liberation Sans'">STATUS is then read for identity;</text><text x="128.5" y="968.901" fill="#4A4230" font-size="12" textLength="182.789" font-family="'Liberation Sans'">Authenticating is unreachable until</text><text x="128.5" y="982.7" fill="#4A4230" font-size="12" textLength="190.09" font-family="'Liberation Sans'">it matches. No L3 traffic before that.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0018" id="lnk19" data-link-type="dependency"><polygon points="64.013,925.493,69.591,917.377,64.927,920.578,61.726,915.914,64.013,925.493" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M76.481,858.473 C71.337,886.126 67.925,904.463 64.927,920.578" style="stroke:#44546A;stroke-width:1;" fill="none"/><text x="75.5" y="889.504" fill="#2F3B4C" font-size="12" textLength="98.719" font-family="'Liberation Sans'">StatusRead match</text></g></g></svg>