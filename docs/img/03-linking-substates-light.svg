352,916.435 L369.352,924.935 A1.5,1.5 0 0 0 370.852,926.435 L379.352,926.435 L369.352,916.435" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="140.96" y="933.195" fill="#4A4230" font-size="12" textLength="223.392" font-family="'Helvetica Neue'">Subscribed means the transport is usable</text><text x="140.96" y="947.511" fill="#4A4230" font-size="12" textLength="215.82" font-family="'Helvetica Neue'">and notifications are confirmed enabled.</text><text x="140.96" y="961.827" fill="#4A4230" font-size="12" textLength="175.572" font-family="'Helvetica Neue'">STATUS is then read for identity;</text><text x="140.96" y="976.143" fill="#4A4230" font-size="12" textLength="184.488" font-family="'Helvetica Neue'">Authenticating is unreachable until</text><text x="140.96" y="990.459" fill="#4A4230" font-size="12" textLength="193.596" font-family="'Helvetica Neue'">it matches. No L3 traffic before that.</text></g><!--link Linking to Authenticating--><g class="link" data-entity-1="ent0001" data-entity-2="ent0018" id="lnk19" data-source-line="16" data-link-type="dependency"><path d="M76.95,840.715 C69.4,878.965 64.016,906.249 59.956,926.859" style="stroke:#44546A;stroke-width:1;" fill="none" id="Linking-to-Authenticating"/><polygon points="58.99,931.765,64.654,923.708,59.956,926.859,56.805,922.162,58.99,931.765" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="69.82" y="883.195" fill="#2F3B4C" font-size="12" textLength="99.588" font-family="'Helvetica Neue'">StatusRead match</text></g></g></svg>