<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:660px;height:482px;background:#0D1117;" width="660px" height="482px" viewBox="0 0 660 482" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="660" height="482" fill="#0D1117" style="stroke:none;"/><g class="title" data-source-line="3"><text x="200.155" y="30.06" fill="#E6EDF3" font-size="15" textLength="258.24" font-weight="700" font-family="'Helvetica Neue'">Fragmentation at the minimum MTU</text></g><g><title>Transport L1</title><rect x="128.938" y="79.824" width="8" height="361.432" fill="#000" fill-opacity="0"/><line x1="132.438" y1="79.824" x2="132.438" y2="441.256" style="stroke:#46525F;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>GATT Server L1</title><rect x="396.758" y="79.824" width="8" height="361.432" fill="#000" fill-opacity="0"/><line x1="400.258" y1="79.824" x2="400.258" y2="441.256" style="stroke:#46525F;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="88.355" y="49.315" width="88.165" height="29.509" fill="#17314F" style="stroke:#4A5A70;stroke-width:0.5;" rx="3" ry="3"/><text x="95.355" y="69.055" fill="#E6EDF3" font-size="13" textLength="74.165" font-family="'Helvetica Neue'">Transport L1</text><rect x="347.036" y="49.315" width="106.443" height="29.509" fill="#4A1F1F" style="stroke:#4A5A70;stroke-width:0.5;" rx="3" ry="3"/><text x="354.036" y="69.055" fill="#E6EDF3" font-size="13" textLength="92.443" font-family="'Helvetica Neue'">GATT Server L1</text><rect x="88.355" y="441.256" width="88.165" height="29.509" fill="#17314F" style="stroke:#4A5A70;stroke-width:0.5;" rx="3" ry="3"/><text x="95.355" y="460.996" fill="#E6EDF3" font-size="13" textLength="74.165" font-family="'Helvetica Neue'">Transport L1</text><rect x="347.036" y="441.256" width="106.443" height="29.509" fill="#4A1F1F" style="stroke:#4A5A70;stroke-width:0.5;" rx="3" ry="3"/><text x="354.036" y="460.996" fill="#E6EDF3" font-size="13" textLength="92.443" font-family="'Helvetica Neue'">GATT Server L1</text><path d="M88.786,95.824 L88.786,127.824 A3,3 0 0 0 91.786,130.824 L440.786,130.824 A3,3 0 0 0 443.786,127.824 L443.786,102.824 L433.786,92.824 L91.786,92.824 A3,3 0 0 0 88.786,95.824" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M433.786,92.824 L433.786,101.324 A1.5,1.5 0 0 0 435.286,102.824 L443.786,102.824 L433.786,92.824" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="178.118" y="109.584" fill="#E3D9B8" font-size="12" textLength="167.46" font-family="'Helvetica Neue'">ATT_MTU = 23, so 19 octets of</text><text x="178.118" y="123.9" fill="#E3D9B8" font-size="12" textLength="144.228" font-family="'Helvetica Neue'">fragment payload per write</text><path d="M15,144.456 L15,176.456 A3,3 0 0 0 18,179.456 L246,179.456 A3,3 0 0 0 249,176.456 L249,151.456 L239,141.456 L18,141.456 A3,3 0 0 0 15,144.456" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M239,141.456 L239,149.956 A1.5,1.5 0 0 0 240.5,151.456 L249,151.456 L239,141.456" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="21" y="158.216" fill="#E3D9B8" font-size="12" textLength="168.036" font-family="'Helvetica Neue'">BOLUS_REQ PDU is 22 octets:</text><text x="21" y="172.532" fill="#E3D9B8" font-size="12" textLength="213.876" font-family="'Helvetica Neue'">8 header + 4 payload + 8 MAC + 2 CRC</text><polygon points="388.258,201.74,398.258,205.74,388.258,209.74,392.258,205.74" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="132.438" y1="205.74" x2="394.258" y2="205.74" style="stroke:#8B98A8;stroke-width:1;"/><text x="139.438" y="201.136" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Helvetica Neue'">1</text><text x="150.11" y="201.016" fill="#C9D1D9" font-size="12" textLength="233.148" font-family="'Helvetica Neue'">write CMD, hdr 0x80 FIRST idx 0, 19 octets</text><path d="M405.258,221.74 L405.258,239.74 A3,3 0 0 0 408.258,242.74 L611.258,242.74 A3,3 0 0 0 614.258,239.74 L614.258,228.74 L604.258,218.74 L408.258,218.74 A3,3 0 0 0 405.258,221.74" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M604.258,218.74 L604.258,227.24 A1.5,1.5 0 0 0 605.758,228.74 L614.258,228.74 L604.258,218.74" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="411.258" y="235.5" fill="#E3D9B8" font-size="12" textLength="188.46" font-family="'Helvetica Neue'">FIRST resets the reassembly buffer</text><polygon points="388.258,264.708,398.258,268.708,388.258,272.708,392.258,268.708" fill="#8B98A8" style="stroke:#8B98A8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="132.438" y1="268.708" x2="394.258" y2="268.708" style="stroke:#8B98A8;stroke-width:1;"/><text x="139.438" y="264.104" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Helvetica Neue'">2</text><text x="150.11" y="263.984" fill="#C9D1D9" font-size="12" textLength="222.708" font-family="'Helvetica Neue'">write CMD, hdr 0x41 LAST idx 1, 3 octets</text><path d="M405.258,284.708 L405.258,302.708 A3,3 0 0 0 408.258,305.708 L641.258,305.708 A3,3 0 0 0 644.258,302.708 L644.258,291.708 L634.258,281.708 L408.258,281.708 A3,3 0 0 0 405.258,284.708" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><path d="M634.258,281.708 L634.258,290.208 A1.5,1.5 0 0 0 635.758,291.708 L644.258,291.708 L634.258,281.708" style="stroke:#6B5E32;stroke-width:0.5;" fill="#2A2416"/><text x="411.258" y="298.468" fill="#E3D9B8" font-size="12" textLength="218.292" font-family="'Helvetica Neue'">LAST completes, 22 octets passed to L2</text><line x1="133.438" y1="331.676" x2="143.438" y2="327.676" style="stroke:#8B98A8;stroke-width:1;"/><line x1="133.438" y1="331.676" x2="143.438" y2="335.676" style="stroke:#8B98A8;stroke-width:1;"/><line x1="132.438" y1="331.676" x2="399.258" y2="331.676" style="stroke:#8B98A8;stroke-width:1;"/><text x="149.438" y="327.072" fill="#C9D1D9" font-size="12" font-weight="700" font-family="'Helvetica Neue'">3</text><text x="160.11" y="326.952" fill="#C9D1D9" font-size="12" textLength="216.036" font-family="'Helvetica Neue'">BOLUS_RSP, fragmented the same way</text><path d="M88.786,347.676 L88.786,422.676 A3,3 0 0 0 91.786,425.676 L440.786,425.676 A3,3 0 0 0 443.786,422.676 L443.786,354.676 L433.786,344.676 L91.786,344.676 A3,3 0 0 0 88.786,347.676" style="stroke:#6B5E32;stroke-width:0.5;" fill="#3E1F1F"/><path d="M433.786,344.676 L433.786,353.176 A1.5,1.5 0 0 0 435.286,354.676 L443.786,354.676 L433.786,344.676" style="stroke:#6B5E32;stroke-width:0.5;" fill="#3E1F1F"/><text x="109.502" y="361.436" fill="#E3D9B8" font-size="12" textLength="286.944" font-family="'Helvetica Neue'">The reassembly buffer is discarded on disconnection,</text><text x="109.502" y="375.752" fill="#E3D9B8" font-size="12" textLength="247.824" font-family="'Helvetica Neue'">on a FIRST arriving mid-message, on an index</text><text x="109.502" y="390.068" fill="#E3D9B8" font-size="12" textLength="264.3" font-family="'Helvetica Neue'">discontinuity, and above 512 octets. A buffer that</text><text x="109.502" y="404.384" fill="#E3D9B8" font-size="12" textLength="304.692" font-family="'Helvetica Neue'">survives a disconnection is how two unrelated messages</text><text x="109.502" y="418.7" fill="#E3D9B8" font-size="12" textLength="284.028" font-family="'Helvetica Neue'">get spliced into one valid-looking PDU. Hazard H-09.</text></g></svg>