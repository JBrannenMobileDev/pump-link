<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:633px;height:466px;background:#FFFFFF;" width="633px" height="466px" viewBox="0 0 633 466" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="252.297" y="25.06" fill="#1F2933" font-size="15" textLength="121.905" font-weight="700" font-family="'Helvetica Neue'">Protocol layering</text></g><!--entity L4--><g class="entity" data-qualified-name="L4" id="ent0001" data-source-line="5"><rect x="22" y="51.315" width="324.824" height="51.382" fill="#DBEAFE" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="32" y="74.367" fill="#4A5568" font-size="13" textLength="84.032" font-weight="700" font-family="'Helvetica Neue'">L4 — Session</text><text x="32" y="89.928" fill="#4A5568" font-size="13" textLength="304.824" font-family="'Helvetica Neue'">mutual authentication, key derivation, replay window</text></g><!--entity L3--><g class="entity" data-qualified-name="L3" id="ent0002" data-source-line="6"><rect x="13" y="138.315" width="343.089" height="51.382" fill="#DBEAFE" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="23" y="161.367" fill="#4A5568" font-size="13" textLength="103.766" font-weight="700" font-family="'Helvetica Neue'">L3 — Operations</text><text x="23" y="176.928" fill="#4A5568" font-size="13" textLength="323.089" font-family="'Helvetica Neue'">opcodes, request/response correlation, ACK/NAK, retry</text></g><!--entity L2--><g class="entity" data-qualified-name="L2" id="ent0003" data-source-line="7"><rect x="6" y="225.315" width="356.882" height="51.382" fill="#DBEAFE" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="16" y="248.367" fill="#4A5568" font-size="13" textLength="122.798" font-weight="700" font-family="'Helvetica Neue'">L2 — Message PDU</text><text x="16" y="263.928" fill="#4A5568" font-size="13" textLength="336.882" font-family="'Helvetica Neue'">header, sequence, CRC-16, message authentication code</text></g><!--entity L1--><g class="entity" data-qualified-name="L1" id="ent0004" data-source-line="8"><rect x="17" y="312.315" width="334.951" height="51.382" fill="#E7E3F7" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="27" y="335.367" fill="#4A5568" font-size="13" textLength="125.905" font-weight="700" font-family="'Helvetica Neue'">L1 — Fragmentation</text><text x="27" y="350.928" fill="#4A5568" font-size="13" textLength="314.951" font-family="'Helvetica Neue'">split and reassemble against the negotiated ATT_MTU</text></g><!--entity L0--><g class="entity" data-qualified-name="L0" id="ent0005" data-source-line="9"><rect x="31" y="399.315" width="306.728" height="51.382" fill="#FEE2E2" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="41" y="422.367" fill="#4A5568" font-size="13" textLength="69.823" font-weight="700" font-family="'Helvetica Neue'">L0 — GATT</text><text x="41" y="437.928" fill="#4A5568" font-size="13" textLength="286.728" font-family="'Helvetica Neue'">write-with-response on CMD, notification on RSP</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="17"><path d="M370,328.815 L370,333.815 L352.088,337.815 L370,341.815 L370,347.131 A3,3 0 0 0 373,350.131 L520.264,350.131 A3,3 0 0 0 523.264,347.131 L523.264,335.815 L513.264,325.815 L373,325.815 A3,3 0 0 0 370,328.815" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M513.264,325.815 L513.264,334.315 A1.5,1.5 0 0 0 514.764,335.815 L523.264,335.815 L513.264,325.815" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="376" y="342.575" fill="#4A4230" font-size="12" textLength="132.264" font-family="'Helvetica Neue'">Only L1 knows the MTU.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="21"><path d="M365.5,67.815 L365.5,72.815 L347.133,76.815 L365.5,80.815 L365.5,86.131 A3,3 0 0 0 368.5,89.131 L514.432,89.131 A3,3 0 0 0 517.432,86.131 L517.432,74.815 L507.432,64.815 L368.5,64.815 A3,3 0 0 0 365.5,67.815" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M507.432,64.815 L507.432,73.315 A1.5,1.5 0 0 0 508.932,74.815 L517.432,74.815 L507.432,64.815" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="371.5" y="81.575" fill="#4A4230" font-size="12" textLength="130.932" font-family="'Helvetica Neue'">Only L4 knows the keys.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="25"><path d="M381.5,234.315 L381.5,246.815 L363.226,250.815 L381.5,254.815 L381.5,266.947 A3,3 0 0 0 384.5,269.947 L614.9,269.947 A3,3 0 0 0 617.9,266.947 L617.9,241.315 L607.9,231.315 L384.5,231.315 A3,3 0 0 0 381.5,234.315" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M607.9,231.315 L607.9,239.815 A1.5,1.5 0 0 0 609.4,241.315 L617.9,241.315 L607.9,231.315" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="387.5" y="248.075" fill="#4A4230" font-size="12" textLength="215.4" font-family="'Helvetica Neue'">L2 and L3 are pure byte transformations</text><text x="387.5" y="262.391" fill="#4A4230" font-size="12" textLength="203.628" font-family="'Helvetica Neue'">and are the bulk of the JVM test suite.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="184.5,138.285,188.5,129.285,184.5,133.285,180.5,129.285,184.5,138.285" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M184.5,102.401 C184.5,113.678 184.5,122.014 184.5,133.285" style="stroke:#44546A;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="184.5,225.285,188.5,216.285,184.5,220.285,180.5,216.285,184.5,225.285" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M184.5,189.401 C184.5,200.678 184.5,209.014 184.5,220.285" style="stroke:#44546A;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="184.5,312.285,188.5,303.285,184.5,307.285,180.5,303.285,184.5,312.285" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M184.5,276.401 C184.5,287.678 184.5,296.014 184.5,307.285" style="stroke:#44546A;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="184.5,399.285,188.5,390.285,184.5,394.285,180.5,390.285,184.5,399.285" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M184.5,363.401 C184.5,374.678 184.5,383.014 184.5,394.285" style="stroke:#44546A;stroke-width:1;" fill="none"/></g></g></svg>