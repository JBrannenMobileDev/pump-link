<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:650px;height:557px;background:#FFFFFF;" width="650px" height="557px" viewBox="0 0 650 557" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="260.867" y="25.06" fill="#1F2933" font-size="15" textLength="121.905" font-weight="700" font-family="'Helvetica Neue'">Protocol layering</text></g><!--entity L4--><g class="entity" data-qualified-name="L4" id="ent0001" data-source-line="5"><rect x="23.03" y="46.315" width="324.824" height="51.382" fill="#DBEAFE" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="33.03" y="69.367" fill="#4A5568" font-size="13" textLength="84.032" font-weight="700" font-family="'Helvetica Neue'">L4 — Session</text><text x="33.03" y="84.928" fill="#4A5568" font-size="13" textLength="304.824" font-family="'Helvetica Neue'">mutual authentication, key derivation, replay window</text></g><!--entity L3--><g class="entity" data-qualified-name="L3" id="ent0002" data-source-line="6"><rect x="13.9" y="157.695" width="343.089" height="51.382" fill="#DBEAFE" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="23.9" y="180.747" fill="#4A5568" font-size="13" textLength="103.766" font-weight="700" font-family="'Helvetica Neue'">L3 — Operations</text><text x="23.9" y="196.308" fill="#4A5568" font-size="13" textLength="323.089" font-family="'Helvetica Neue'">opcodes, request/response correlation, ACK/NAK, retry</text></g><!--entity L2--><g class="entity" data-qualified-name="L2" id="ent0003" data-source-line="7"><rect x="7" y="269.075" width="356.882" height="51.382" fill="#DBEAFE" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="17" y="292.127" fill="#4A5568" font-size="13" textLength="122.798" font-weight="700" font-family="'Helvetica Neue'">L2 — Message PDU</text><text x="17" y="307.688" fill="#4A5568" font-size="13" textLength="336.882" font-family="'Helvetica Neue'">header, sequence, CRC-16, message authentication code</text></g><!--entity L1--><g class="entity" data-qualified-name="L1" id="ent0004" data-source-line="8"><rect x="17.97" y="380.465" width="334.951" height="51.382" fill="#E7E3F7" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="27.97" y="403.517" fill="#4A5568" font-size="13" textLength="125.905" font-weight="700" font-family="'Helvetica Neue'">L1 — Fragmentation</text><text x="27.97" y="419.078" fill="#4A5568" font-size="13" textLength="314.951" font-family="'Helvetica Neue'">split and reassemble against the negotiated ATT_MTU</text></g><!--entity L0--><g class="entity" data-qualified-name="L0" id="ent0005" data-source-line="9"><rect x="32.08" y="491.845" width="306.728" height="51.382" fill="#FEE2E2" style="stroke:#C3CEDD;stroke-width:0.5;" rx="3" ry="3"/><text x="42.08" y="514.897" fill="#4A5568" font-size="13" textLength="69.823" font-weight="700" font-family="'Helvetica Neue'">L0 — GATT</text><text x="42.08" y="530.458" fill="#4A5568" font-size="13" textLength="286.728" font-family="'Helvetica Neue'">write-with-response on CMD, notification on RSP</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="17"><path d="M387.81,396.995 L387.81,402.155 L353.28,406.155 L387.81,410.155 L387.81,415.311 A3,3 0 0 0 390.81,418.311 L538.074,418.311 A3,3 0 0 0 541.074,415.311 L541.074,403.995 L531.074,393.995 L390.81,393.995 A3,3 0 0 0 387.81,396.995" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M531.074,393.995 L531.074,402.495 A1.5,1.5 0 0 0 532.574,403.995 L541.074,403.995 L531.074,393.995" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="393.81" y="410.755" fill="#4A4230" font-size="12" textLength="132.264" font-family="'Helvetica Neue'">Only L1 knows the MTU.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="21"><path d="M382.47,62.845 L382.47,68.005 L348.33,72.005 L382.47,76.005 L382.47,81.161 A3,3 0 0 0 385.47,84.161 L531.402,84.161 A3,3 0 0 0 534.402,81.161 L534.402,69.845 L524.402,59.845 L385.47,59.845 A3,3 0 0 0 382.47,62.845" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M524.402,59.845 L524.402,68.345 A1.5,1.5 0 0 0 525.902,69.845 L534.402,69.845 L524.402,59.845" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="388.47" y="76.605" fill="#4A4230" font-size="12" textLength="130.932" font-family="'Helvetica Neue'">Only L4 knows the keys.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="25"><path d="M399.24,278.455 L399.24,290.765 L364.09,294.765 L399.24,298.765 L399.24,311.087 A3,3 0 0 0 402.24,314.087 L632.64,314.087 A3,3 0 0 0 635.64,311.087 L635.64,285.455 L625.64,275.455 L402.24,275.455 A3,3 0 0 0 399.24,278.455" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M625.64,275.455 L625.64,283.955 A1.5,1.5 0 0 0 627.14,285.455 L635.64,285.455 L625.64,275.455" style="stroke:#D9C89A;stroke-width:0.5;" fill="#FFF8DC"/><text x="405.24" y="292.215" fill="#4A4230" font-size="12" textLength="215.4" font-family="'Helvetica Neue'">L2 and L3 are pure byte transformations</text><text x="405.24" y="306.531" fill="#4A4230" font-size="12" textLength="203.628" font-family="'Helvetica Neue'">and are the bulk of the JVM test suite.</text></g><!--link L4 to L3--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="11" data-link-type="dependency"><path d="M185.44,98.105 C185.44,115.885 185.44,134.645 185.44,152.415" style="stroke:#44546A;stroke-width:1;" fill="none" id="L4-to-L3"/><polygon points="185.44,157.415,189.44,148.415,185.44,152.415,181.44,148.415,185.44,157.415" fill="#44546A" style="stroke:#44546A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link L3 to L2--><g class="link" 