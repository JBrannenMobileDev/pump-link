name: build

on:
  push:
  pull_request:

jobs:
  # The pure modules carry most of the scenario table and need no SDK, so they
  # get their own fast job. If this is red, the protocol is wrong; everything
  # below is packaging.
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Module boundaries
        run: ./gradlew checkModuleBoundaries

      - name: Pure JVM modules
        run: ./gradlew :protocol:check :domain:check :simulator:check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: "*/build/reports/tests/**"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble and check
        run: ./gradlew :app:assembleDebug :app:check :data:check
